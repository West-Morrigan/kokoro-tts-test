name: Pocket TTS 18M Rust smoke test
on:
  workflow_dispatch:
  push:
    branches: [experiment/pocket-tts-18m]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run smoke
